replicaCount: 1

image:
  repository: ghcr.io/autoeditor-video-or-audio/tts-trainer
  tag: v1.1.0-gpu
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

env:
  TTS_TRAINER_LOG_LEVEL: "INFO"
  MINIO_ENDPOINT: "minio.minio.svc.cluster.local:9000"
  MINIO_BUCKET: "tts-training"
  MINIO_SECURE: "false"
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  # MINIO_ACCESS_KEY and MINIO_SECRET_KEY are pulled from a k8s
  # secret bound by templates/deployment.yaml — never put them
  # into values.yaml.

persistence:
  datasets:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 100Gi
  runs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi
  hf:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 16Gi

resources:
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: 1
  requests:
    cpu: "2"
    memory: 8Gi
    nvidia.com/gpu: 1

nodeSelector: {}
tolerations: []
affinity: {}
